<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            appBg: '#F5F4F1',
            appCard: '#FFFFFF',
            appText: '#080808',
            appBorder: '#E7E6E2',
            appSecondary: '#71716D',
            focusAccent: '#E06553', /* Coral/Rose Focus token from dashboard */
            focusBg: '#FDF2F0',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F5F4F1;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    .tap-active:active {
      transform: scale(0.97);
      transition: transform 0.1s ease;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 m-0 bg-[#E8E7E3]">

  <!-- Mobile Frame (390 x 844) -->
  <div class="relative w-[390px] h-[844px] bg-[#F5F4F1] text-[#080808] flex flex-col justify-between overflow-hidden shadow-2xl rounded-[44px] border-[6px] border-[#222]">
    
    <!-- Status Bar Area -->
    <div class="pt-3 px-7 flex justify-between items-center text-xs font-semibold text-[#080808] select-none z-10">
      <span class="">9:41</span>
      <div class="w-20 h-4 bg-black rounded-full mx-auto -mt-1"></div>
      <div class="flex items-center space-x-1.5">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5v14M7 9v10M2 13v6M22 2v20"></path></svg>
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"></path></svg>
        <div class="w-5 h-2.5 border border-black rounded-sm p-0.5 flex items-center">
          <div class="w-3 h-1.5 bg-black rounded-2xs"></div>
        </div>
      </div>
    </div>

    <!-- Main Scrollable Content -->
    <div class="flex-1 overflow-y-auto px-5 pt-3 pb-28">
      
      <!-- Header -->
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-[32px] font-extrabold tracking-tight text-[#080808]">Focus</h1>
        <button class="w-10 h-10 rounded-full bg-white border border-[#E7E6E2] flex items-center justify-center text-[#71716D] shadow-sm tap-active" aria-label="Info">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 16v-4"></path>
            <path d="M12 8h.01"></path>
          </svg>
        </button>
      </div>

      <!-- Hero Card (Focus Ring & Add Button) -->
      <div class="bg-white rounded-[24px] p-6 border border-[#E7E6E2] shadow-sm flex flex-col items-center justify-center text-center relative overflow-hidden mb-5">
        <!-- Circular Progress Ring Container -->
        <div class="relative w-44 h-44 flex items-center justify-center mb-3">
          <svg class="w-full h-full transform -rotate-90" viewBox="0 0 160 160">
            <!-- Background Ring -->
            <circle cx="80" cy="80" r="68" stroke="#F5F4F1" stroke-width="10" fill="none"></circle>
            <!-- Animated Accent Ring -->
            <circle cx="80" cy="80" r="68" stroke="#E06553" stroke-width="10" stroke-linecap="round" fill="none" stroke-dasharray="427" stroke-dashoffset="140"></circle>
          </svg>
          
          <!-- Inner Round + Button -->
          <button class="absolute w-20 h-20 rounded-full bg-[#080808] text-white flex items-center justify-center shadow-md hover:scale-105 active:scale-95 transition-all tap-active" aria-label="Block distracting apps">
            <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
          </button>
        </div>

        <h3 class="text-[17px] font-bold text-[#080808] mb-0.5">Block distracting apps</h3>
        <p class="text-xs font-medium text-[#71716D]">Pick apps &amp; set healthy daily limits</p>
      </div>

      <!-- Stats Row (3 Small Cards) -->
      <div class="grid grid-cols-3 gap-2.5 mb-6">
        <!-- Stat 1 -->
        <div class="bg-white rounded-[20px] p-3.5 border border-[#E7E6E2] shadow-sm flex flex-col justify-between">
          <div class="w-7 h-7 rounded-full bg-[#FDF2F0] text-[#E06553] flex items-center justify-center mb-2">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
          </div>
          <span class="text-xl font-extrabold text-[#080808] leading-tight">3</span>
          <span class="text-[11px] font-medium text-[#71716D] mt-0.5">Apps blocked</span>
        </div>

        <!-- Stat 2 -->
        <div class="bg-white rounded-[20px] p-3.5 border border-[#E7E6E2] shadow-sm flex flex-col justify-between">
          <div class="w-7 h-7 rounded-full bg-[#F3F4F6] text-[#080808] flex items-center justify-center mb-2">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          </div>
          <span class="text-xl font-extrabold text-[#080808] leading-tight">1h 15m</span>
          <span class="text-[11px] font-medium text-[#71716D] mt-0.5">Time saved</span>
        </div>

        <!-- Stat 3 -->
        <div class="bg-white rounded-[20px] p-3.5 border border-[#E7E6E2] shadow-sm flex flex-col justify-between">
          <div class="w-7 h-7 rounded-full bg-[#F3F4F6] text-[#080808] flex items-center justify-center mb-2">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          </div>
          <span class="text-xl font-extrabold text-[#080808] leading-tight">12</span>
          <span class="text-[11px] font-medium text-[#71716D] mt-0.5">Blocks fired</span>
        </div>
      </div>

      <!-- Section "Blocked apps" -->
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center space-x-2">
          <h2 class="text-lg font-bold text-[#080808]">Blocked apps</h2>
          <span class="px-2 py-0.5 text-xs font-semibold bg-[#EAE8E3] text-[#080808] rounded-full">3</span>
        </div>
        <button class="text-sm font-semibold text-[#080808] hover:text-[#E06553] transition-colors tap-active">
          + Add
        </button>
      </div>

      <!-- Blocked Apps List -->
      <div class="space-y-3">
        
        <!-- App Card 1: YouTube (Blocking) -->
        <div class="bg-white rounded-[20px] p-4 border border-[#E7E6E2] shadow-sm flex flex-col tap-active cursor-pointer">
          <div class="flex items-center justify-between mb-2.5">
            <div class="flex items-center space-x-3">
              <!-- App Logo (44px) -->
              <div class="w-11 h-11 rounded-[12px] bg-[#FF0000]/10 flex items-center justify-center border border-[#FF0000]/20 text-[#FF0000]">
                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"></path></svg>
              </div>
              <div>
                <h4 class="text-base font-bold text-[#080808]">YouTube</h4>
                <div class="flex items-center space-x-2 text-xs font-medium text-[#71716D]">
                  <span class="">27m spent</span>
                  <span class="">•</span>
                  <span class="text-[#080808] font-semibold">40m left</span>
                </div>
              </div>
            </div>
            <!-- Status Pill -->
            <span class="px-2.5 py-1 text-[11px] font-bold rounded-full bg-[#EBF7EE] text-[#1E7E34] border border-[#D1F0D9]">
              Blocking
            </span>
          </div>
          <!-- Progress Bar -->
          <div class="w-full bg-[#F5F4F1] h-2 rounded-full overflow-hidden mt-1">
            <div class="bg-[#E06553] h-full rounded-full" style="width: 40%"></div>
          </div>
        </div>

        <!-- App Card 2: Instagram (Limit reached) -->
        <div class="bg-white rounded-[20px] p-4 border border-[#E7E6E2] shadow-sm flex flex-col tap-active cursor-pointer">
          <div class="flex items-center justify-between mb-2.5">
            <div class="flex items-center space-x-3">
              <!-- App Logo (44px) -->
              <div class="w-11 h-11 rounded-[12px] bg-gradient-to-tr from-[#FD1D1D]/10 to-[#833AB4]/10 flex items-center justify-center border border-[#FD1D1D]/20 text-[#E1306C]">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
              </div>
              <div>
                <h4 class="text-base font-bold text-[#080808]">Instagram</h4>
                <div class="flex items-center space-x-2 text-xs font-medium text-[#71716D]">
                  <span class="text-[#D32F2F] font-semibold">45m spent</span>
                  <span class="">•</span>
                  <span class="">0m left</span>
                </div>
              </div>
            </div>
            <!-- Status Pill -->
            <span class="px-2.5 py-1 text-[11px] font-bold rounded-full bg-[#FDF2F2] text-[#D32F2F] border border-[#FAD2D2]">
              Limit reached
            </span>
          </div>
          <!-- Progress Bar -->
          <div class="w-full bg-[#F5F4F1] h-2 rounded-full overflow-hidden mt-1">
            <div class="bg-[#D32F2F] h-full rounded-full" style="width: 100%"></div>
          </div>
        </div>

        <!-- App Card 3: Chrome (Paused) -->
        <div class="bg-white rounded-[20px] p-4 border border-[#E7E6E2] shadow-sm flex flex-col tap-active cursor-pointer">
          <div class="flex items-center justify-between mb-2.5">
            <div class="flex items-center space-x-3">
              <!-- App Logo (44px) -->
              <div class="w-11 h-11 rounded-[12px] bg-[#4285F4]/10 flex items-center justify-center border border-[#4285F4]/20 text-[#4285F4]">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="4"></circle><line x1="21.17" y1="8" x2="12" y2="8"></line><line x1="3.95" y1="6.06" x2="8.54" y2="14"></line><line x1="10.88" y1="21.94" x2="15.46" y2="14"></line></svg>
              </div>
              <div>
                <h4 class="text-base font-bold text-[#080808]">Chrome</h4>
                <div class="flex items-center space-x-2 text-xs font-medium text-[#71716D]">
                  <span class="">12m spent</span>
                  <span class="">•</span>
                  <span class="">48m left</span>
                </div>
              </div>
            </div>
            <!-- Status Pill -->
            <span class="px-2.5 py-1 text-[11px] font-bold rounded-full bg-[#F5F4F1] text-[#71716D] border border-[#E7E6E2]">
              Paused
            </span>
          </div>
          <!-- Progress Bar -->
          <div class="w-full bg-[#F5F4F1] h-2 rounded-full overflow-hidden mt-1">
            <div class="bg-[#A8A7A1] h-full rounded-full" style="width: 20%"></div>
          </div>
        </div>

      </div>

    </div>

    <!-- Floating Pill Bottom Navigation (with Focus active) -->
    <div class="absolute bottom-5 inset-x-5 flex justify-center z-30">
      
    </div>

  </div>




</body></html>
