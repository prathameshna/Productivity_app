<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Apps - Select Apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            appBg: '#F5F4F1',
            appCard: '#FFFFFF',
            appText: '#080808',
            appBorder: '#E7E6E2',
            appSecondary: '#71716D',
            focusAccent: '#E06553',
            focusBg: '#FDF2F0',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F5F4F1;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    .tap-active:active {
      transform: scale(0.97);
      transition: transform 0.1s ease;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 m-0 bg-[#E8E7E3]">

  <!-- Mobile Frame (390 x 844) -->
  <div class="relative w-[390px] h-[844px] bg-[#F5F4F1] text-[#080808] flex flex-col justify-between overflow-hidden shadow-2xl rounded-[44px] border-[6px] border-[#222]">
    
    <!-- Status Bar Area -->
    <div class="pt-3 px-7 flex justify-between items-center text-xs font-semibold text-[#080808] select-none z-10">
      <span>9:41</span>
      <div class="w-20 h-4 bg-black rounded-full mx-auto -mt-1"></div>
      <div class="flex items-center space-x-1.5">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5v14M7 9v10M2 13v6M22 2v20"/></svg>
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
        <div class="w-5 h-2.5 border border-black rounded-sm p-0.5 flex items-center">
          <div class="w-3 h-1.5 bg-black rounded-2xs"></div>
        </div>
      </div>
    </div>

    <!-- Top Bar -->
    <div class="px-5 pt-3 pb-2 flex items-center justify-between">
      <button class="w-10 h-10 rounded-full bg-white border border-[#E7E6E2] flex items-center justify-center text-[#080808] shadow-sm tap-active" aria-label="Back">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 class="text-lg font-bold text-[#080808]">Block apps</h1>
      <button class="w-10 h-10 rounded-full bg-white border border-[#E7E6E2] flex items-center justify-center text-[#080808] shadow-sm tap-active" aria-label="Search">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
    </div>

    <!-- Main Scrollable Content -->
    <div class="flex-1 overflow-y-auto px-5 pt-2 pb-6">
      
      <!-- Search Field -->
      <div class="relative mb-4">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#71716D]">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
        <input type="text" placeholder="Search apps" class="w-full pl-10 pr-4 py-2.5 bg-white border border-[#E7E6E2] rounded-full text-sm font-medium text-[#080808] placeholder-[#71716D] focus:outline-none focus:border-[#080808] shadow-sm" readonly value="">
      </div>

      <!-- Segmented Control (Apps & Websites) -->
      <div class="bg-[#EAE8E3] p-1 rounded-full flex mb-4">
        <button class="flex-1 py-1.5 text-xs font-bold text-[#080808] bg-white rounded-full shadow-sm text-center">
          Apps
        </button>
        <button class="flex-1 py-1.5 text-xs font-semibold text-[#71716D] hover:text-[#080808] rounded-full text-center">
          Websites
        </button>
      </div>

      <!-- Apps List -->
      <div class="bg-white rounded-[24px] border border-[#E7E6E2] shadow-sm overflow-hidden divide-y divide-[#F5F4F1]">
        
        <!-- App 1: YouTube (Already added) -->
        <div class="p-3.5 flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="w-11 h-11 rounded-[12px] bg-[#FF0000]/10 flex items-center justify-center text-[#FF0000] border border-[#FF0000]/20">
              <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            </div>
            <div>
              <h3 class="text-sm font-bold text-[#080808]">YouTube</h3>
              <p class="text-xs font-medium text-[#71716D]">Usage today: 1h 40m</p>
            </div>
          </div>
          <button class="px-3 py-1.5 rounded-full bg-[#F5F4F1] text-[#71716D] text-xs font-semibold flex items-center space-x-1 cursor-default" disabled>
            <svg class="w-3.5 h-3.5 text-[#1E7E34]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
            <span>Added</span>
          </button>
        </div>

        <!-- App 2: Chrome (Added) -->
        <div class="p-3.5 flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="w-11 h-11 rounded-[12px] bg-[#4285F4]/10 flex items-center justify-center text-[#4285F4] border border-[#4285F4]/20">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="4"></circle><line x1="21.17" y1="8" x2="12" y2="8"></line><line x1="3.95" y1="6.06" x2="8.54" y2="14"></line><line x1="10.88" y1="21.94" x2="15.46" y2="14"></line></svg>
            </div>
            <div>
              <h3 class="text-sm font-bold text-[#080808]">Chrome</h3>
              <p class="text-xs font-medium text-[#71716D]">Usage today: 55m</p>
            </div>
          </div>
          <button class="px-3 py-1.5 rounded-full bg-[#F5F4F1] text-[#71716D] text-xs font-semibold flex items-center space-x-1 cursor-default" disabled>
            <svg class="w-3.5 h-3.5 text-[#1E7E34]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
            <span>Added</span>
          </button>
        </div>

        <!-- App 3: Instagram (Add) -->
        <div class="p-3.5 flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="w-11 h-11 rounded-[12px] bg-gradient-to-tr from-[#FD1D1D]/10 to-[#833AB4]/10 flex items-center justify-center text-[#E1306C] border border-[#FD1D1D]/20">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
            </div>
            <div>
              <h3 class="text-sm font-bold text-[#080808]">Instagram</h3>
              <p class="text-xs font-medium text-[#71716D]">Usage today: 1h 15m</p>
            </div>
          </div>
          <button class="px-4 py-1.5 rounded-full bg-[#080808] text-white text-xs font-semibold tap-active shadow-sm hover:bg-neutral-800">
            Add
          </button>
        </div>

        <!-- App 4: Snapchat -->
        <div class="p-3.5 flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="w-11 h-11 rounded-[12px] bg-[#FFFC00]/20 flex items-center justify-center text-[#080808] border border-[#FFFC00]/40">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.686 2 6 4.686 6 8c0 1.956.938 3.69 2.4 4.8-.4.5-.8 1.1-.9 1.7-.1.4.1.8.5.9.6.1 1.2-.1 1.7-.5.5-.4 1.1-.7 1.8-.7.2 0 .4 0 .5.1.4.2.9.2 1.3 0 .2-.1.4-.1.5-.1.7 0 1.3.3 1.8.7.5.4 1.1.6 1.7.5.4-.1.6-.5.5-.9-.1-.6-.5-1.2-.9-1.7 1.462-1.11 2.4-2.844 2.4-4.8 0-3.314-2.686-6-6-6z"/></svg>
            </div>
            <div>
              <h3 class="text-sm font-bold text-[#080808]">Snapchat</h3>
              <p class="text-xs font-medium text-[#71716D]">Usage today: 42m</p>
            </div>
          </div>
          <button class="px-4 py-1.5 rounded-full bg-[#080808] text-white text-xs font-semibold tap-active shadow-sm hover:bg-neutral-800">
            Add
          </button>
        </div>

        <!-- App 5: Facebook -->
        <div class="p-3.5 flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="w-11 h-11 rounded-[12px] bg-[#1877F2]/10 flex items-center justify-center text-[#1877F2] border border-[#1877F2]/20">
              <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            </div>
            <div>
              <h3 class="text-sm font-bold text-[#080808]">Facebook</h3>
              <p class="text-xs font-medium text-[#71716D]">Usage today: 35m</p>
            </div>
          </div>
          <button class="px-4 py-1.5 rounded-full bg-[#080808] text-white text-xs font-semibold tap-active shadow-sm hover:bg-neutral-800">
            Add
          </button>
        </div>

        <!-- App 6: X (formerly Twitter) -->
        <div class="p-3.5 flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="w-11 h-11 rounded-[12px] bg-[#000000]/10 flex items-center justify-center text-[#080808] border border-[#080808]/20">
              <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            </div>
            <div>
              <h3 class="text-sm font-bold text-[#080808]">X</h3>
              <p class="text-xs font-medium text-[#71716D]">Usage today: 1h 05m</p>
            </div>
          </div>
          <button class="px-4 py-1.5 rounded-full bg-[#080808] text-white text-xs font-semibold tap-active shadow-sm hover:bg-neutral-800">
            Add
          </button>
        </div>

        <!-- App 7: Reddit -->
        <div class="p-3.5 flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="w-11 h-11 rounded-[12px] bg-[#FF4500]/10 flex items-center justify-center text-[#FF4500] border border-[#FF4500]/20">
              <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
            </div>
            <div>
              <h3 class="text-sm font-bold text-[#080808]">Reddit</h3>
              <p class="text-xs font-medium text-[#71716D]">Usage today: 50m</p>
            </div>
          </div>
          <button class="px-4 py-1.5 rounded-full bg-[#080808] text-white text-xs font-semibold tap-active shadow-sm hover:bg-neutral-800">
            Add
          </button>
        </div>

        <!-- App 8: WhatsApp -->
        <div class="p-3.5 flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="w-11 h-11 rounded-[12px] bg-[#25D366]/10 flex items-center justify-center text-[#25D366] border border-[#25D366]/20">
              <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M12.031 2c-5.514 0-9.999 4.486-9.999 10 0 1.761.458 3.479 1.33 5l-1.362 4.978 5.093-1.336c1.472.802 3.125 1.228 4.82 1.228 5.514 0 10-4.486 10-10s-4.486-10-10-10zm0 18.25c-1.523 0-3.003-.408-4.306-1.182l-.309-.184-3.197.838.853-3.116-.202-.322c-.853-1.357-1.303-2.934-1.303-4.554 0-4.549 3.701-8.25 8.25-8.25 4.549 0 8.25 3.701 8.25 8.25 0 4.549-3.701 8.25-8.25 8.25z"/></svg>
            </div>
            <div>
              <h3 class="text-sm font-bold text-[#080808]">WhatsApp</h3>
              <p class="text-xs font-medium text-[#71716D]">Usage today: 2h 10m</p>
            </div>
          </div>
          <button class="px-4 py-1.5 rounded-full bg-[#080808] text-white text-xs font-semibold tap-active shadow-sm hover:bg-neutral-800">
            Add
          </button>
        </div>

        <!-- App 9: Netflix -->
        <div class="p-3.5 flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="w-11 h-11 rounded-[12px] bg-[#E50914]/10 flex items-center justify-center text-[#E50914] border border-[#E50914]/20">
              <span class="font-extrabold text-sm tracking-wider">N</span>
            </div>
            <div>
              <h3 class="text-sm font-bold text-[#080808]">Netflix</h3>
              <p class="text-xs font-medium text-[#71716D]">Usage today: 1h 20m</p>
            </div>
          </div>
          <button class="px-4 py-1.5 rounded-full bg-[#080808] text-white text-xs font-semibold tap-active shadow-sm hover:bg-neutral-800">
            Add
          </button>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
