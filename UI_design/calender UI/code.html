<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Date Picker Modal - Serene Cadence</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            serene: {
              surface: '#F8F7F4',
              modal: '#FFFFFF',
              border: '#E8E6DF',
              dark: '#191816',
              secondary: '#6E6C65',
              muted: '#A5A39D',
              amber: '#E8A725',
              amberLight: '#FDF7EB',
              accentHover: '#D4951B'
            }
          },
          boxShadow: {
            'modal-elevation': '0 20px 48px -12px rgba(25, 24, 22, 0.12), 0 4px 16px -2px rgba(25, 24, 22, 0.04)',
          }
        }
      }
    };
  </script>
<!-- Custom Typography & Micro-interactions -->
<style data-purpose="custom-styling">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .grid-cell {
      aspect-ratio: 1 / 1;
    }
  </style>
</head>
<body class="bg-[#ECEAE4] min-h-screen flex items-center justify-center p-4 antialiased selection:bg-amber-100 selection:text-amber-900">
<!-- BEGIN: ModalBackdrop -->
<main class="w-full max-w-sm flex flex-col items-center justify-center" data-purpose="mobile-dialog-wrapper">
<!-- BEGIN: DatePickerCard -->
<section aria-labelledby="calendar-title" class="w-full bg-serene-modal rounded-[28px] border border-serene-border shadow-modal-elevation px-6 pt-7 pb-6 transition-all" data-purpose="date-picker-card">
<!-- BEGIN: HeaderSection -->
<header class="mb-6">
<!-- Prominent Selected Date Display -->
<h1 class="text-3xl font-extrabold text-serene-dark tracking-tight leading-none mb-6" id="calendar-title">
          10 Oct 2026
        </h1>
<!-- Month Navigation & Dropdown Bar -->
<div class="flex items-center justify-between pt-1 pb-1" data-purpose="month-navigation">
<!-- Month & Year Selector -->
<button aria-label="Select month and year" class="flex items-center gap-1.5 text-base font-semibold text-serene-dark hover:opacity-80 active:opacity-60 transition-opacity focus:outline-none" type="button">
<span class="">October 2026</span>
<!-- Dropdown Caret Icon -->
<svg aria-hidden="true" class="w-4 h-4 text-serene-secondary translate-y-0.5" fill="currentColor" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z" fill-rule="evenodd"></path>
</svg>
</button>
<!-- Prev/Next Controls -->
<div class="flex items-center gap-1 -mr-1" data-purpose="month-paginator">
<!-- Previous Month Button -->
<button aria-label="Previous month" class="w-9 h-9 flex items-center justify-center rounded-full text-serene-secondary hover:text-serene-dark hover:bg-stone-100 active:scale-95 transition-all focus:outline-none" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Next Month Button -->
<button aria-label="Next month" class="w-9 h-9 flex items-center justify-center rounded-full text-serene-secondary hover:text-serene-dark hover:bg-stone-100 active:scale-95 transition-all focus:outline-none" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: CalendarGrid -->
<div class="w-full" data-purpose="calendar-matrix">
<!-- Weekday Headers (S M T W T F S) -->
<div class="grid grid-cols-7 mb-2 text-center text-xs font-semibold text-serene-muted tracking-wider">
<span class="py-1">S</span>
<span class="py-1">M</span>
<span class="py-1">T</span>
<span class="py-1">W</span>
<span class="py-1">T</span>
<span class="py-1">F</span>
<span class="py-1">S</span>
</div>
<!-- Days Numbers (October 2026: 1st is Thursday) -->
<div class="grid grid-cols-7 gap-y-1 text-center font-medium text-serene-dark text-[15px]">
<!-- Row 1: Empty Sunday, Monday, Tuesday, Wednesday -->
<div class="grid-cell flex items-center justify-center"></div>
<div class="grid-cell flex items-center justify-center"></div>
<div class="grid-cell flex items-center justify-center"></div>
<div class="grid-cell flex items-center justify-center"></div>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">1</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">2</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">3</button>
<!-- Row 2: 4 - 10 -->
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">4</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">5</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">6</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">7</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">8</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">9</button>
<!-- Highlighted/Selected Date: 10 -->
<div class="grid-cell flex items-center justify-center">
<button aria-current="date" aria-label="Selected date: October 10, 2026" class="w-9 h-9 flex items-center justify-center rounded-full bg-serene-amber text-serene-dark font-bold shadow-sm ring-2 ring-serene-amber/30 transition-transform transform active:scale-90" type="button">
              10
            </button>
</div>
<!-- Row 3: 11 - 17 -->
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">11</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">12</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">13</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">14</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">15</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">16</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">17</button>
<!-- Row 4: 18 - 24 -->
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">18</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">19</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">20</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">21</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">22</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">23</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">24</button>
<!-- Row 5: 25 - 31 -->
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">25</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">26</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">27</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">28</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">29</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">30</button>
<button class="grid-cell flex items-center justify-center rounded-full hover:bg-stone-100 transition-colors" type="button">31</button>
</div>
</div>
<!-- END: CalendarGrid -->
<!-- BEGIN: DialogActionButtons -->
<footer class="mt-8 flex items-center justify-end gap-3" data-purpose="dialog-actions">
<!-- Cancel Action -->
<button class="px-5 py-2.5 text-sm font-semibold text-serene-secondary hover:text-serene-dark active:scale-95 transition-all rounded-full hover:bg-stone-100 focus:outline-none" type="button">
          Cancel
        </button>
<!-- OK Action -->
<button class="px-7 py-2.5 bg-serene-amber hover:bg-serene-accentHover active:scale-95 text-serene-dark text-sm font-bold rounded-full shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-serene-amber" type="button">
          OK
        </button>
</footer>
<!-- END: DialogActionButtons -->
</section>
<!-- END: DatePickerCard -->
<!-- BEGIN: ContextualSaveButton -->
<!-- Ambient auxiliary save button for realistic preview matching original screen layout -->
<div class="w-full mt-4" data-purpose="outer-alarm-action">

</div>
<!-- END: ContextualSaveButton -->
</main>
<!-- END: ModalBackdrop -->


</body></html>
