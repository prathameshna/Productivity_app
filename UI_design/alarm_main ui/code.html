<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>SuperAlarm</title>
<!-- Google Font: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            surface: {
              DEFAULT: '#faf9f6',
              card: '#ffffff',
            },
            text: {
              primary: '#171715',
              secondary: '#6f706a',
              muted: '#9a9b95',
            },
            accent: {
              gold: '#ffd026',
              goldHover: '#f5c61a',
            }
          },
          boxShadow: {
            card: '0 2px 10px -2px rgba(23, 23, 21, 0.05), 0 1px 3px -1px rgba(23, 23, 21, 0.04)',
            fab: '0 8px 24px -4px rgba(255, 208, 38, 0.4), 0 4px 12px -2px rgba(23, 23, 21, 0.08)',
          }
        }
      }
    }
  </script>
<style data-purpose="toggle-switch">
    /* Custom accessible toggle styling */
    .toggle-checkbox:checked {
      right: 0;
      border-color: #ffd026;
    }
    .toggle-checkbox:checked + .toggle-label {
      background-color: #ffd026;
    }
    .toggle-checkbox:checked + .toggle-label::after {
      transform: translateX(100%);
      background-color: #171715;
    }
  </style>
</head>
<body class="bg-surface font-sans text-text-primary min-h-screen antialiased flex justify-center selection:bg-accent-gold selection:text-text-primary">
<!-- Mobile Viewport Wrapper (iOS device bounds) -->
<div class="w-full max-w-[430px] min-h-screen flex flex-col justify-between relative px-6 pt-12 pb-8 bg-surface">
<!-- BEGIN: HeaderAndContent -->
<main class="w-full flex flex-col flex-1">
<!-- BEGIN: TopBar -->
<!-- App Header: Brand title and options icon -->
<header class="flex items-center justify-between pt-2 pb-6 relative" data-purpose="top-navigation">
<h1 class="text-[28px] font-extrabold tracking-tight text-text-primary">SuperAlarm</h1>
<div class="relative" id="options-menu-wrapper"><button aria-expanded="true" aria-haspopup="true" aria-label="More options" class="w-10 h-10 flex items-center justify-center rounded-full text-text-primary hover:bg-black/5 active:bg-black/10 transition-colors" data-purpose="more-options-button" id="more-options-btn" onclick="const menu = document.getElementById('options-dropdown'); const isHidden = menu.classList.contains('hidden'); menu.classList.toggle('hidden'); this.setAttribute('aria-expanded', isHidden);" type="button"><svg aria-hidden="true" class="w-5 h-5 text-text-primary" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg></button><div class="absolute right-0 top-12 z-40 w-48 bg-surface-card rounded-[22px] border border-stone-200/60 shadow-card py-2 flex flex-col" data-purpose="options-dropdown-menu" id="options-dropdown" role="menu"><button class="w-full flex items-center gap-3 px-4 py-2.5 text-[14px] font-semibold text-text-primary hover:bg-black/5 transition-colors text-left" role="menuitem" type="button"><svg aria-hidden="true" class="w-4 h-4 text-text-secondary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" x2="12" y1="2" y2="12"></line></svg><span class="">Disable alarms</span></button></div></div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: StatusHeading -->
<!-- Alarm state summary -->
<div class="mt-1 mb-7" data-purpose="status-summary">
<h2 class="text-[22px] font-bold text-text-primary tracking-tight">All alarms are off</h2>
</div>
<!-- END: StatusHeading -->
<!-- BEGIN: AlarmList -->
<section aria-label="Alarms" class="flex flex-col gap-4" data-purpose="alarm-cards-list">
<!-- BEGIN: AlarmCard1 -->
<!-- Card 1: 6:05 am everyday -->
<article class="bg-surface-card rounded-[26px] p-5 border border-stone-200/60 shadow-card hover:border-stone-300 transition-all duration-200" data-purpose="alarm-item">
<div class="flex items-center justify-between">
<div class="flex flex-col">
<!-- Label -->
<span class="text-[13px] font-semibold text-text-secondary tracking-wide">Every day</span>
<!-- Time readout -->
<div class="flex items-baseline gap-1.5 mt-1">
<span class="text-[40px] font-extrabold text-text-primary tracking-tight leading-none">6:05</span>
<span class="text-xl font-bold text-text-primary tracking-tight">am</span>
</div>
<!-- 2x2 Grid / Mission indicator -->
<div aria-label="Alarm feature configured" class="mt-3 text-text-muted flex items-center">
<svg aria-hidden="true" class="w-[18px] h-[18px] opacity-75" fill="currentColor" viewBox="0 0 24 24">
<rect height="7" rx="1.5" width="7" x="3" y="3"></rect>
<rect height="7" rx="1.5" width="7" x="14" y="3"></rect>
<rect height="7" rx="1.5" width="7" x="3" y="14"></rect>
<rect height="7" rx="1.5" width="7" x="14" y="14"></rect>
</svg>
</div>
</div>
<!-- Toggle Switch Container -->
<div class="flex items-center self-center" data-purpose="toggle-container">
<label class="relative inline-flex items-center cursor-pointer select-none">
<input aria-label="Toggle 6:05 am alarm" class="sr-only peer" id="alarm-toggle-1" type="checkbox">
<div class="w-14 h-8 bg-stone-200 rounded-full peer peer-checked:bg-accent-gold transition-colors duration-200 ease-in-out"></div>
<div class="absolute left-1 top-1 bg-white w-6 h-6 rounded-full shadow-sm peer-checked:translate-x-6 peer-checked:bg-text-primary transition-all duration-200 ease-in-out"></div>
</label>
</div>
</div>
</article>
<!-- END: AlarmCard1 -->
<!-- BEGIN: AlarmCard2 -->
<!-- Card 2: 6:23 am tomorrow -->
<article class="bg-surface-card rounded-[26px] p-5 border border-stone-200/60 shadow-card hover:border-stone-300 transition-all duration-200" data-purpose="alarm-item">
<div class="flex items-center justify-between">
<div class="flex flex-col">
<!-- Label -->
<span class="text-[13px] font-semibold text-text-secondary tracking-wide">Tomorrow</span>
<!-- Time readout -->
<div class="flex items-baseline gap-1.5 mt-1">
<span class="text-[40px] font-extrabold text-text-primary tracking-tight leading-none">6:23</span>
<span class="text-xl font-bold text-text-primary tracking-tight">am</span>
</div>
<!-- 2x2 Grid / Mission indicator -->
<div aria-label="Alarm feature configured" class="mt-3 text-text-muted flex items-center">
<svg aria-hidden="true" class="w-[18px] h-[18px] opacity-75" fill="currentColor" viewBox="0 0 24 24">
<rect height="7" rx="1.5" width="7" x="3" y="3"></rect>
<rect height="7" rx="1.5" width="7" x="14" y="3"></rect>
<rect height="7" rx="1.5" width="7" x="3" y="14"></rect>
<rect height="7" rx="1.5" width="7" x="14" y="14"></rect>
</svg>
</div>
</div>
<!-- Toggle Switch Container -->
<div class="flex items-center self-center" data-purpose="toggle-container">
<label class="relative inline-flex items-center cursor-pointer select-none">
<input aria-label="Toggle 6:23 am alarm" class="sr-only peer" id="alarm-toggle-2" type="checkbox">
<div class="w-14 h-8 bg-stone-200 rounded-full peer peer-checked:bg-accent-gold transition-colors duration-200 ease-in-out"></div>
<div class="absolute left-1 top-1 bg-white w-6 h-6 rounded-full shadow-sm peer-checked:translate-x-6 peer-checked:bg-text-primary transition-all duration-200 ease-in-out"></div>
</label>
</div>
</div>
</article>
<!-- END: AlarmCard2 -->
</section>
<!-- END: AlarmList -->
</main>
<!-- END: HeaderAndContent -->
<!-- BEGIN: FloatingActionButton -->
<!-- Add new alarm button -->
<div class="fixed bottom-8 right-6 max-w-[430px] flex justify-end z-30 pointer-events-none" data-purpose="fab-wrapper">
<button aria-label="Add new alarm" class="pointer-events-auto w-[68px] h-[68px] rounded-[22px] bg-accent-gold hover:bg-accent-goldHover active:scale-95 text-text-primary flex items-center justify-center shadow-fab transition-all duration-150 ease-out focus:outline-none focus:ring-4 focus:ring-accent-gold/40" data-purpose="add-alarm-button" type="button">
<!-- Crisp Plus Icon -->
<svg aria-hidden="true" class="w-8 h-8 text-text-primary stroke-[2.8]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
<line x1="12" x2="12" y1="5" y2="19"></line>
<line x1="5" x2="19" y1="12" y2="12"></line>
</svg>
</button>
</div>
<!-- END: FloatingActionButton -->
</div>


</body></html>
