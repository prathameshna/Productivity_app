<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Edit Alarm</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              surface: '#F5F4F1',
              card: '#FFFFFF',
              cardLow: '#F4F3F0',
              primary: '#171715',
              secondary: '#6F706A',
              border: '#E6E4DD',
              accent: '#C96543',
              accentBg: '#F9ECE5',
              dark: '#080808',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-scroll-and-touch">
    /* Disable bounce and unwanted tap highlights for iOS native feel */
    body {
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    input::placeholder {
      color: #6F706A;
      opacity: 0.8;
    }
  </style>
</head>
<body class="bg-brand-surface text-brand-primary min-h-screen font-sans flex justify-center selection:bg-brand-accent/20">
<!-- Mobile Screen Container (Emulates iOS viewport width max-w-md) -->
<div class="w-full max-w-md min-h-screen flex flex-col justify-between pb-8 px-5 pt-3">
<!-- Top Content Area -->
<div class="flex flex-col space-y-4">
<!-- BEGIN: NavigationHeader -->
<header class="flex items-center pt-2 pb-1" data-purpose="top-navigation">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-black/5 active:bg-black/10 transition-colors" type="button">
<!-- Back arrow chevron -->
<svg class="w-6 h-6 stroke-brand-primary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<line x1="19" x2="5" y1="12" y2="12"></line>
<polyline points="12 19 5 12 12 5"></polyline>
</svg>
</button>
<h1 class="text-xl font-bold tracking-tight text-brand-primary ml-2">Edit alarm</h1>
</header>
<!-- END: NavigationHeader -->
<!-- BEGIN: StatusSubheader -->
<section class="pt-1 pb-1" data-purpose="alarm-status-countdown">
<h2 class="text-[22px] font-bold text-brand-primary tracking-tight leading-snug">
          Alarm in 6 hours 22 minutes
        </h2>
</section>
<!-- END: StatusSubheader -->
<!-- BEGIN: TimePickerWheelCard -->
<section class="relative bg-brand-card rounded-2xl border border-brand-border p-4 shadow-sm overflow-hidden" data-purpose="time-drum-roller-picker">
<!-- Morning Sun Icon on top right -->
<div class="absolute top-4 right-4 text-amber-500">
<svg class="w-7 h-7 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" r="4"></circle>
<path d="M12 2v2"></path>
<path d="M12 20v2"></path>
<path d="m4.93 4.93 1.41 1.41"></path>
<path d="m17.66 17.66 1.41 1.41"></path>
<path d="M2 12h2"></path>
<path d="M20 12h2"></path>
<path d="m6.34 17.66-1.41 1.41"></path>
<path d="m19.07 4.93-1.41 1.41"></path>
</svg>
</div>
<!-- Drum Roller Rows -->
<div class="flex flex-col items-center justify-center py-2 select-none">
<!-- Row -2: Most Faded -->
<div class="flex items-center justify-center w-3/4 py-1 text-sm font-semibold text-brand-secondary/40">
<span class="w-20 text-center">4</span>
<span class="w-20 text-center">03</span>
<span class="w-16"></span>
</div>
<!-- Row -1: Medium Faded -->
<div class="flex items-center justify-center w-3/4 py-1 text-base font-semibold text-brand-secondary/70">
<span class="w-20 text-center">5</span>
<span class="w-20 text-center">04</span>
<span class="w-16"></span>
</div>
<!-- Active Selected Row (Highlighted pill bar) -->
<div class="flex items-center justify-center w-full py-2.5 my-1 bg-brand-cardLow rounded-xl border border-brand-border/60">
<div class="flex items-center justify-center w-3/4 text-2xl font-bold text-brand-primary">
<span class="w-20 text-center text-3xl">6</span>
<span class="w-20 text-center text-3xl">05</span>
<span class="w-16 text-center text-xl font-bold lowercase text-brand-primary">am</span>
</div>
</div>
<!-- Row +1: Medium Faded -->
<div class="flex items-center justify-center w-3/4 py-1 text-base font-semibold text-brand-secondary/70">
<span class="w-20 text-center">7</span>
<span class="w-20 text-center">06</span>
<span class="w-16 text-center text-sm font-semibold lowercase">pm</span>
</div>
<!-- Row +2: Most Faded -->
<div class="flex items-center justify-center w-3/4 py-1 text-sm font-semibold text-brand-secondary/40">
<span class="w-20 text-center">8</span>
<span class="w-20 text-center">07</span>
<span class="w-16"></span>
</div>
</div>
</section>
<!-- END: TimePickerWheelCard -->
<!-- BEGIN: DaysOfWeekRepeatCard -->
<section class="bg-brand-card rounded-2xl border border-brand-border p-4 shadow-sm flex flex-col space-y-3.5" data-purpose="repeat-days-selector">
<!-- Top header row of section -->
<div class="flex items-center justify-between"><span id="repeat-days-summary" class="text-sm font-medium text-brand-primary">None</span><div class="flex items-center space-x-2.5"><button aria-label="Open Calendar" class="text-brand-secondary hover:text-brand-primary transition-colors p-0.5" type="button"><svg class="w-5 h-5 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect height="18" rx="3" ry="3" width="18" x="3" y="4"></rect><line x1="16" x2="16" y1="2" y2="6"></line><line x1="8" x2="8" y1="2" y2="6"></line><line x1="3" x2="21" y1="10" y2="10"></line></svg></button><label class="relative inline-flex items-center cursor-pointer select-none" title="Select / Deselect all days"><input id="select-all-days-checkbox" type="checkbox" checked="" class="sr-only peer" onchange="(function(cb){const btns=document.querySelectorAll('#repeat-days-pills button');const summary=document.getElementById('repeat-days-summary');btns.forEach(b=&gt;{if(cb.checked){b.className='aspect-square flex items-center justify-center rounded-full bg-brand-dark text-white text-xs font-semibold shadow-xs transition-colors';}else{b.className='aspect-square flex items-center justify-center rounded-full bg-brand-cardLow text-brand-secondary text-xs font-semibold shadow-xs hover:bg-brand-border/40 transition-colors';}});if(summary){summary.textContent=cb.checked?'Every day':'None';}})(this)"><div class="w-5 h-5 rounded-md border border-brand-accent bg-brand-accent flex items-center justify-center text-white peer-checked:bg-brand-accent peer-checked:border-brand-accent transition-colors shadow-xs"><svg class="w-3.5 h-3.5 text-white stroke-current" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polyline points="20 6 9 17 4 12"></polyline></svg></div></label></div></div>
<!-- Day pill circular buttons: [S] [M] [T] [W] [T] [F] [S] -->
<div class="grid grid-cols-7 gap-2" id="repeat-days-pills">
<!-- Sunday -->
<button class="aspect-square flex items-center justify-center rounded-full bg-brand-cardLow text-brand-secondary text-xs font-semibold shadow-xs hover:bg-brand-border/40 transition-colors" type="button">
            S
          </button>
<!-- Monday -->
<button class="aspect-square flex items-center justify-center rounded-full bg-brand-cardLow text-brand-secondary text-xs font-semibold shadow-xs hover:bg-brand-border/40 transition-colors" type="button">
            M
          </button>
<!-- Tuesday -->
<button class="aspect-square flex items-center justify-center rounded-full bg-brand-cardLow text-brand-secondary text-xs font-semibold shadow-xs hover:bg-brand-border/40 transition-colors" type="button">
            T
          </button>
<!-- Wednesday -->
<button class="aspect-square flex items-center justify-center rounded-full bg-brand-cardLow text-brand-secondary text-xs font-semibold shadow-xs hover:bg-brand-border/40 transition-colors" type="button">
            W
          </button>
<!-- Thursday -->
<button class="aspect-square flex items-center justify-center rounded-full bg-brand-cardLow text-brand-secondary text-xs font-semibold shadow-xs hover:bg-brand-border/40 transition-colors" type="button">
            T
          </button>
<!-- Friday -->
<button class="aspect-square flex items-center justify-center rounded-full bg-brand-cardLow text-brand-secondary text-xs font-semibold shadow-xs hover:bg-brand-border/40 transition-colors" type="button">
            F
          </button>
<!-- Saturday -->
<button class="aspect-square flex items-center justify-center rounded-full bg-brand-cardLow text-brand-secondary text-xs font-semibold shadow-xs hover:bg-brand-border/40 transition-colors" type="button">
            S
          </button>
</div>
</section>
<!-- END: DaysOfWeekRepeatCard -->
<!-- BEGIN: AlarmNameCard -->
<section class="bg-brand-card rounded-2xl border border-brand-border px-4 py-3.5 shadow-sm" data-purpose="alarm-name-input-card">
<label class="sr-only" for="alarm-name">Alarm Name</label>
<input class="w-full bg-transparent border-0 p-0 text-sm font-medium text-brand-primary placeholder:text-brand-secondary focus:ring-0 focus:outline-none" id="alarm-name" placeholder="Enter an alarm name" type="text">
</section>
<!-- END: AlarmNameCard -->
<!-- BEGIN: MissionBadgeCard -->
<section class="bg-brand-card rounded-2xl border border-brand-border px-4 py-3.5 shadow-sm flex items-center justify-between cursor-pointer active:bg-brand-cardLow transition-colors" data-purpose="mission-selection-card">
<span class="text-sm font-medium text-brand-primary">Mission</span>
<div class="flex items-center space-x-2">
<!-- Memory badge with terracotta styling -->
<div class="flex items-center space-x-1.5 bg-brand-accentBg text-brand-accent px-2.5 py-1 rounded-lg">
<!-- Grid 4-dots icon -->
<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<rect height="7" rx="1.5" width="7" x="3" y="3"></rect>
<rect height="7" rx="1.5" width="7" x="14" y="3"></rect>
<rect height="7" rx="1.5" width="7" x="3" y="14"></rect>
<rect height="7" rx="1.5" width="7" x="14" y="14"></rect>
</svg>
<span class="text-xs font-semibold">Memory</span>
</div>
<!-- Chevron Right -->
<svg class="w-4 h-4 text-brand-secondary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</div>
</section>
<!-- END: MissionBadgeCard -->
<!-- BEGIN: SoundAndAlertSettingsCard -->
<section class="bg-brand-card rounded-2xl border border-brand-border divide-y divide-brand-border shadow-sm" data-purpose="sound-and-alert-options">
<!-- Row: Sound -->
<div class="px-4 py-3.5 flex items-center justify-between cursor-pointer active:bg-brand-cardLow transition-colors">
<span class="text-sm font-medium text-brand-primary">Sound</span>
<div class="flex items-center space-x-1 text-brand-secondary">
<span class="text-sm font-normal">Skyblue</span>
<svg class="w-4 h-4 text-brand-secondary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</div>
</div>
<!-- Row: Vibration -->
<div class="px-4 py-3.5 flex items-center justify-between cursor-pointer active:bg-brand-cardLow transition-colors">
<span class="text-sm font-medium text-brand-primary">Vibration</span>
<div class="flex items-center space-x-1 text-brand-secondary">
<span class="text-sm font-normal">Basic</span>
<svg class="w-4 h-4 text-brand-secondary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</div>
</div>
<!-- Row: Snooze -->
<div class="px-4 py-3.5 flex items-center justify-between cursor-pointer active:bg-brand-cardLow transition-colors">
<span class="text-sm font-medium text-brand-primary">Snooze</span>
<div class="flex items-center space-x-1 text-brand-secondary">
<span class="text-sm font-normal">5 minutes, forever</span>
<svg class="w-4 h-4 text-brand-secondary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</div>
</div>
<!-- Row: Wake Up Check -->
<div class="px-4 py-3.5 flex items-center justify-between cursor-pointer active:bg-brand-cardLow transition-colors">
<div class="flex items-center space-x-1.5">
<span class="text-sm font-medium text-brand-primary">Wake Up Check</span>
<!-- Lock Icon -->
<svg class="w-3.5 h-3.5 text-brand-secondary fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C9.243 2 7 4.243 7 7v3H6c-1.103 0-2 .897-2 2v8c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-8c0-1.103-.897-2-2-2h-1V7c0-2.757-2.243-5-5-5zM9 7c0-1.654 1.346-3 3-3s3 1.346 3 3v3H9V7z"></path>
</svg>
</div>
<div class="flex items-center space-x-1 text-brand-secondary">
<span class="text-sm font-normal">Off</span>
<svg class="w-4 h-4 text-brand-secondary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</div>
</div>
</section>
<!-- END: SoundAndAlertSettingsCard -->
<!-- BEGIN: ShowMemoCard -->
<section class="bg-brand-card rounded-2xl border border-brand-border p-4 shadow-sm flex flex-col space-y-3.5" data-purpose="memo-toggle-and-input-card">
<!-- Top toggle row -->
<div class="flex items-center justify-between">
<span class="text-sm font-medium text-brand-primary">Show memo after alarm</span>
<!-- iOS style toggle switch (ON state with dark brand accent) -->
<label class="relative inline-flex items-center cursor-pointer select-none">
<input aria-label="Toggle show memo after alarm" checked="" class="sr-only peer" type="checkbox">
<div class="w-12 h-6 bg-brand-border peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-6 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-dark"></div>
</label>
</div>
<!-- Bottom memo placeholder row with note/memo icon -->
<div class="flex items-center space-x-2.5 pt-0.5">
<svg class="w-4 h-4 text-brand-secondary shrink-0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
<polyline points="14 2 14 8 20 8"></polyline>
<line x1="16" x2="8" y1="13" y2="13"></line>
<line x1="16" x2="8" y1="17" y2="17"></line>
<polyline points="10 9 9 9 8 9"></polyline>
</svg>
<label class="sr-only" for="alarm-memo-input">Enter an alarm memo</label>
<input class="w-full bg-transparent border-0 p-0 text-sm font-normal text-brand-primary placeholder:text-brand-secondary focus:ring-0 focus:outline-none" id="alarm-memo-input" placeholder="Enter an alarm memo" type="text">
</div>
</section>
<!-- END: ShowMemoCard -->
</div>
<!-- BEGIN: PrimaryActionButton -->
<footer class="pt-6 pb-2" data-purpose="save-button-wrapper">
<button class="w-full py-3.5 px-6 bg-brand-dark text-white rounded-full font-semibold text-base tracking-wide hover:bg-neutral-800 active:scale-[0.99] transition-all duration-150 shadow-md flex items-center justify-center" type="button">
        Save
      </button>
</footer>
<!-- END: PrimaryActionButton -->
</div>


</body></html>
