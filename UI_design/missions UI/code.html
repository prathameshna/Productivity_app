<script>
  // Subtle interactive feedback on selection
  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {

      if (title) {
        btn.classList.add('bg-surface-container');
        setTimeout(() => {
          btn.classList.remove('bg-surface-container');
        }, 180);
      }
    });
  });
