<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Account &amp; Profile</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            surface: '#FAF9F6',
            card: '#FFFFFF',
            cardBorder: '#F0EEE9',
            brandText: '#18181B',
            mutedText: '#6F706A',
            subtleText: '#9E9F99',
            accentBlue: '#2563EB',
            accentBlueBg: '#EFF6FF',
            accentGreen: '#16A34A',
            accentGreenBg: '#DCFCE7',
            coralSignout: '#EF4444',
          },
          boxShadow: {
            subtle: '0 1px 3px rgba(0, 0, 0, 0.02), 0 1px 2px rgba(0, 0, 0, 0.03)',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-resets">
    /* Remove default tap highlight on mobile devices */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #FAF9F6;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-surface text-brandText min-h-screen flex flex-col justify-between antialiased selection:bg-blue-100">
<!-- BEGIN: TopBar -->
<header class="w-full pt-12 pb-2 px-6 flex items-center justify-between" data-purpose="navigation-header">
<!-- Back Button -->
<button aria-label="Go Back" class="p-2 -ml-2 rounded-full text-brandText hover:bg-neutral-100 transition-colors active:scale-95" type="button">
<svg class="w-6 h-6 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<div class="w-6 h-6"></div> <!-- Spacer for balancing layout -->
</header>
<!-- END: TopBar -->
<main class="flex-1 w-full max-w-md mx-auto px-5 pb-8 flex flex-col" data-purpose="main-content">
<!-- BEGIN: ProfileHeader -->
<section class="flex flex-col items-center pt-2 pb-8" data-purpose="user-profile-header">
<!-- Avatar with subtle tinted container -->
<div class="w-24 h-24 rounded-full bg-[#EBF3FE] flex items-center justify-center mb-4 transition-transform active:scale-98">
<span class="text-[#2563EB] text-3xl font-semibold tracking-tight">JP</span>
</div>
<!-- User Name and Pro Badge -->
<div class="flex items-center space-x-2.5 mb-1.5">
<h1 class="text-[22px] font-bold text-brandText tracking-tight">John Prathamesh</h1>
<span class="px-2.5 py-0.5 text-xs font-semibold text-accentBlue bg-[#EFF6FF] border border-[#BFDBFE] rounded-md tracking-wide">
          Pro
        </span>
</div>
<!-- Subtitle / Email -->

</section>
<!-- END: ProfileHeader -->
<!-- BEGIN: SettingsSections -->
<div class="w-full space-y-6" data-purpose="menu-group-container">
<!-- Section 1: ACCOUNT -->
<div data-purpose="account-section">
<h2 class="text-xs font-bold text-subtleText tracking-wider uppercase px-2 mb-2.5">
          Account
        </h2>
<div class="bg-card rounded-2xl border border-cardBorder shadow-subtle overflow-hidden">
<!-- Item 1: Edit Profile -->
<a class="flex items-center justify-between px-5 py-4 transition-colors hover:bg-stone-50 active:bg-stone-100" href="#edit-profile">
<div class="flex items-center space-x-3.5">
<!-- User Icon -->
<svg class="w-5 h-5 text-mutedText stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[15px] font-medium text-brandText">Edit Profile</span>
</div>
<!-- Right Chevron -->
<svg class="w-4 h-4 text-subtleText stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<div class="border-t border-[#F2EFE9] ml-13 mr-5"></div>
<!-- Item 2: Connected Apps -->
<a class="flex items-center justify-between px-5 py-4 transition-colors hover:bg-stone-50 active:bg-stone-100" href="#connected-apps">
<div class="flex items-center space-x-3.5">
<!-- Flag Icon -->
<svg class="w-5 h-5 text-mutedText stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M3 3v1.5M3 21v-6m0 0l2.77-.693a9 9 0 016.208.682l.108.054a9 9 0 006.086.71l3.114-.779V4.5l-3.114.779a9 9 0 01-6.086-.71l-.108-.054a9 9 0 00-6.208-.682L3 4.5m0 10.5v-6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[15px] font-medium text-brandText">Connected Apps</span>
</div>
<!-- Right Chevron -->
<svg class="w-4 h-4 text-subtleText stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
</div>
</div>
<!-- Section 2: PRODUCTIVITY -->
<div data-purpose="productivity-section">
<h2 class="text-xs font-bold text-subtleText tracking-wider uppercase px-2 mb-2.5">
          Productivity
        </h2>
<div class="bg-card rounded-2xl border border-cardBorder shadow-subtle overflow-hidden">
<!-- Item 1: Reports -->
<a class="flex items-center justify-between px-5 py-4 transition-colors hover:bg-stone-50 active:bg-stone-100" href="#reports">
<div class="flex items-center space-x-3.5">
<!-- Bar Chart Icon -->
<svg class="w-5 h-5 text-mutedText stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[15px] font-medium text-brandText">Reports</span>
</div>
<!-- Right Chevron -->
<svg class="w-4 h-4 text-subtleText stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<div class="border-t border-[#F2EFE9] ml-13 mr-5"></div>
<!-- Item 2: Subscription and Plan -->
<a class="flex items-center justify-between px-5 py-3.5 transition-colors hover:bg-stone-50 active:bg-stone-100" href="#subscription">
<div class="flex items-center space-x-3.5">
<!-- Star/Badge Award Icon -->
<svg class="w-5 h-5 text-mutedText stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<div class="leading-tight">
<span class="text-[15px] font-medium text-brandText block">Subscription and</span>
<span class="text-[15px] font-medium text-brandText block">Plan</span>
</div>
</div>
<div class="flex items-center space-x-2">
<span class="px-3.5 py-1 text-xs font-semibold text-accentBlue bg-[#EFF6FF] rounded-full">
                Upgrade
              </span>
<!-- Right Chevron -->
<svg class="w-4 h-4 text-subtleText stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</a>
</div>
</div>
<!-- Section 3: SUPPORT -->
<div data-purpose="support-section">
<h2 class="text-xs font-bold text-subtleText tracking-wider uppercase px-2 mb-2.5">
          Support
        </h2>
<div class="bg-card rounded-2xl border border-cardBorder shadow-subtle overflow-hidden">
<!-- Item 1: FAQ -->
<a class="flex items-center justify-between px-5 py-4 transition-colors hover:bg-stone-50 active:bg-stone-100" href="#faq">
<div class="flex items-center space-x-3.5">
<!-- Checkmark Circle Icon -->
<svg class="w-5 h-5 text-mutedText stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[15px] font-medium text-brandText">FAQ</span>
</div>
<!-- Right Chevron -->
<svg class="w-4 h-4 text-subtleText stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<div class="border-t border-[#F2EFE9] ml-13 mr-5"></div>
<!-- Item 2: Refer a Friend -->
<a class="flex items-center justify-between px-5 py-4 transition-colors hover:bg-stone-50 active:bg-stone-100" href="#refer">
<div class="flex items-center space-x-3.5">
<!-- Gift Icon -->
<svg class="w-5 h-5 text-mutedText stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M21 11.25v8.25a1.5 1.5 0 01-1.5 1.5H4.5a1.5 1.5 0 01-1.5-1.5v-8.25M12 4.875A2.625 2.625 0 109.375 7.5H12m0-2.625V7.5m0-2.625A2.625 2.625 0 1114.625 7.5H12m0 0V21m-8.625-9.75h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[15px] font-medium text-brandText">Refer a Friend</span>
</div>
<div class="flex items-center space-x-2">
<span class="px-2.5 py-1 text-xs font-semibold text-[#15803D] bg-[#DCFCE7] rounded-full">
                Get 1 month free
              </span>
<!-- Right Chevron -->
<svg class="w-4 h-4 text-subtleText stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</a>
</div>
</div>
</div>
<!-- END: SettingsSections -->
<!-- BEGIN: SignOutAction -->
<div class="w-full pt-10 pb-4 text-center" data-purpose="sign-out-container">
<button class="text-coralSignout hover:text-red-600 font-semibold text-base transition-colors px-6 py-2 rounded-lg active:opacity-75" type="button">
        Sign out
      </button>
</div>
<!-- END: SignOutAction -->
</main>


</body></html>
